<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Left Icon Emblem: Navy Background with Green Circle and White Checkmark -->
  <g transform="translate(8, 7)">
    <!-- Navy Container -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#0c2b4e" />
    
    <!-- Vivid Green Circle -->
    <circle cx="38" cy="38" r="28" fill="#00a851" />

    <!-- Pure White Checkmark -->
    <polygon
      points="24,37 29,32 34,37 48,23 53,28 34,47"
      fill="#ffffff"
    />
  </g>

  <!-- Typography: Ebuymatale.lk -->
  <g transform="translate(100, 20)">
    <!-- Main Text "Ebuymatale.lk" -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#00a851">E</tspan>
      <tspan fill="#0c2b4e">buymatale.lk</tspan>
    </text>

    <!-- Subtitle: SRI LANKA • MATALE MARKETPLACE -->
    <text x="2" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#64748b" letter-spacing="1">
      SRI LANKA • MATALE MARKETPLACE
    </text>
  </g>
</svg>
